<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Agro Select</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      background-color: #FAFAFA;
      color: #1B5E20;
    }
    
    /* Header Shell */
    header {
      background-color: #1B5E20;
      color: #FAFAFA;
      padding: 15px 20px;
    }
    nav a {
      color: #FAFAFA;
      margin-right: 15px;
      text-decoration: none;
    }
    nav a.active {
      color: #FFEB3B;
      font-weight: bold;
      border-bottom: 2px solid #AEEA00;
    }

    /* Content Area */
    main {
      padding: 20px;
      max-width: 500px;
      margin: 30px auto;
      background-color: #ffffff;
      border-top: 4px solid #4CAF50;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h2 {
      color: #1B5E20;
    }
    input, textarea, button {
      width: 100%;
      margin-top: 5px;
      margin-bottom: 15px;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #4CAF50;
      border-radius: 4px;
    }
    button {
      background-color: #4CAF50;
      color: #FAFAFA;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #AEEA00;
      color: #1B5E20;
    }

    /* Footer Shell */
    footer {
      background-color: #1B5E20;
      color: #FAFAFA;
      text-align: center;
      padding: 15px;
      margin-top: 40px;
      border-top: 3px solid #AEEA00;
    }
    footer a {
      color: #FFEB3B;
    }
  </style>
</head>
<body>

  <!-- Shared Header Shell -->
  <header>
    <h1>Agro Select</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="agroselector-crop-details.html">Crops</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </header>

  <!-- Contact Page Content -->
  <main>
    <h2>Contact Us</h2>
    <form>
      <label for="name">Name:</label>
      <input type="text" id="name" required>

      <label for="message">Message:</label>
      <textarea id="message" rows="4" required></textarea>

      <button type="submit">Submit</button>
    </form>
  </main>

  <!-- Shared Footer Shell -->
  <footer>
    <p>Contact: <a href="mailto:support@agroselect.org">support@agroselect.org</a> | +234 800 000 1234</p>
    <p>&copy; 2026 Agro Select</p>
  </footer>

</body>
</html>
